<title>Painel de Verbas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --card:#FFF; --ink:#12161C; --ink2:#5C6673; --mute:#8A94A6; --line:#E3E7EC;
  --accent:#1A3CFF; --bar:#EDF0F4; --ok:#0F9D58; --warn:#C77700;
  font-size:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding:0 16px 64px}
.wrap{max-width:1000px;margin:0 auto}
header{padding:44px 0 16px}
h1{font-size:clamp(1.9rem,4.2vw,2.5rem);margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:.88rem;margin:0;max-width:60ch}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 4px;justify-content:space-between}
.perwrap{position:relative;display:inline-block}
.pbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font:inherit;font-size:.82rem;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.pbtn .car{font-size:.7rem;color:var(--mute)}
.drop{position:absolute;top:calc(100% + 8px);left:0;z-index:999;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:360px;box-shadow:0 8px 32px rgba(18,22,28,.12)}
.drop .cols{display:flex;gap:20px}
.drop .tt{font-size:.62rem;font-weight:700;color:var(--mute);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
.opt[data-on="1"]{background:rgba(26,60,255,.08)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;border:2px solid var(--mute);background:transparent}
.opt[data-on="1"] .dot{border-color:var(--accent);background:var(--accent)}
.opt span{font-size:.82rem;color:var(--ink2)}
.opt[data-on="1"] span{color:var(--ink)}
.custom{display:flex;flex-direction:column;gap:12px;flex:1;padding-top:26px;min-width:150px}
.custom label{display:block;font-size:.7rem;color:var(--mute);margin-bottom:5px}
.custom select{width:100%;font:inherit;font-size:.8rem;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.acoes button{font:inherit;font-size:.8rem;padding:7px 16px;border-radius:7px;cursor:pointer}
.acoes .can{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.acoes .apl{background:var(--accent);border:none;color:#fff;font-weight:600}
.dica{font-size:.76rem;color:var(--mute)}
.totais{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;min-width:0}
.kpi .l{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.kpi .v{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0}
.kpi .s{font-size:.72rem;color:var(--ink2);margin:4px 0 0}
.painel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:16px 0}
table.top{width:100%;border-collapse:collapse;font-size:.88rem}
table.top th{text-align:left;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line)}
table.top td{padding:0;border-bottom:1px solid var(--line)}
tr.cli:last-of-type td{border-bottom:none}
.rowbtn{display:grid;grid-template-columns:1.6fr .9fr .9fr .9fr 1fr 26px;gap:10px;align-items:center;width:100%;padding:14px 18px;background:none;border:none;font:inherit;text-align:left;cursor:pointer}
.rowbtn:hover{background:#FAFBFC}
.nome{font-weight:600}
.flight{display:block;font-size:.72rem;color:var(--mute);font-weight:400;margin-top:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prev{color:var(--mute)}
.pc{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.seta{color:var(--mute);font-size:.7rem;text-align:center;transition:transform .15s}
tr.cli[data-open="1"] .seta{transform:rotate(90deg)}
.det{background:#FAFBFC;padding:4px 18px 16px}
.linha{border-top:1px solid var(--line);padding:12px 0 4px}
.linha:first-child{border-top:none}
.lh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ln{font-size:.8rem;font-weight:600}
.lp{font-size:.72rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.tbl{width:100%;overflow-x:auto}
table.camp{width:100%;border-collapse:collapse;font-size:.8rem}
table.camp th{text-align:left;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:5px 8px}
table.camp td{padding:6px 8px;border-top:1px solid var(--line)}
.na{color:var(--mute)}
footer{color:var(--ink2);font-size:.76rem;padding:22px 4px;line-height:1.6}
@media (max-width:720px){
  .rowbtn{grid-template-columns:1.4fr .9fr .9fr 22px;gap:8px}
  .rowbtn .colprev,.rowbtn .colbar,th.colprev,th.colbar{display:none}
  .drop{min-width:290px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Painel de Verbas</h1>
  <p class="sub">Quanto cada prefeitura gastou no período, quanto ainda deve gastar até o fim do ciclo e o valor previsto no plano. Clique na prefeitura para ver campanha por campanha.</p>
</header>
<div class="barra">
  <div class="perwrap">
    <button class="pbtn" id="pbtn">📅 <span id="plabel"></span> <span class="car">▼</span></button>
    <div class="drop" id="drop" hidden>
      <div class="cols">
        <div style="min-width:150px">
          <div class="tt">Períodos</div>
          <div id="presets"></div>
        </div>
        <div class="custom" id="custom" hidden>
          <div><label>De</label><select id="mde"></select></div>
          <div><label>Até</label><select id="mate"></select></div>
        </div>
      </div>
      <div class="acoes">
        <button class="can" id="cancelar">Cancelar</button>
        <button class="apl" id="aplicar">Aplicar</button>
      </div>
    </div>
  </div>
  <span class="dica" id="dica"></span>
</div>
<div class="totais" id="totais"></div>
<div class="painel" id="painel"></div>
<footer id="rodape"></footer>
</div>

<script>
const D = JSON.parse(document.getElementById('dados').textContent);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+'%';
const MESES = D.meses.map(m=>m.id).sort();
const nomeMes = id => D.meses.find(m=>m.id===id).nome;

const PRESETS=[{key:'mes-atual',label:'Este mês'},{key:'mes-passado',label:'Mês passado'},{key:'ytd',label:'2026 (YTD)'},{key:'personalizado',label:'Personalizado'}];
let preset='mes-atual', de=MESES[MESES.length-1], ate=MESES[MESES.length-1];
let tp=preset,tde=de,tate=ate;
const abertos = new Set();

function intervalo(){
  if(preset==='mes-atual') return {de:'2026-09',ate:'2026-09',label:'Este mês'};
  if(preset==='mes-passado') return {de:'2026-08',ate:'2026-08',label:'Mês passado'};
  if(preset==='ytd') return {de:MESES[0],ate:MESES[MESES.length-1],label:'2026 (YTD)'};
  return {de,ate,label: de===ate?nomeMes(de):nomeMes(de)+' a '+nomeMes(ate)};
}
const mesesNo = iv => MESES.filter(m=>m>=iv.de&&m<=iv.ate);

const drop=document.getElementById('drop'),pbtn=document.getElementById('pbtn');
function pintaPresets(){
  document.getElementById('presets').innerHTML=PRESETS.map(p=>`<div class="opt" data-p="${p.key}" data-on="${tp===p.key?1:0}"><i class="dot"></i><span>${p.label}</span></div>`).join('');
  document.getElementById('custom').hidden = tp!=='personalizado';
}
const opcoesMes=(sel,val)=>sel.innerHTML=MESES.map(m=>`<option value="${m}"${m===val?' selected':''}>${nomeMes(m)}</option>`).join('');
pbtn.onclick=()=>{ if(drop.hidden){tp=preset;tde=de;tate=ate;pintaPresets();opcoesMes(document.getElementById('mde'),tde);opcoesMes(document.getElementById('mate'),tate);drop.hidden=false;} else drop.hidden=true; };
document.getElementById('presets').addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;tp=o.dataset.p;pintaPresets();});
document.getElementById('mde').onchange=e=>tde=e.target.value;
document.getElementById('mate').onchange=e=>tate=e.target.value;
document.getElementById('cancelar').onclick=()=>drop.hidden=true;
document.getElementById('aplicar').onclick=()=>{preset=tp;if(tde>tate){const x=tde;tde=tate;tate=x;}de=tde;ate=tate;drop.hidden=true;render();};
document.addEventListener('click',e=>{if(!drop.hidden&&!e.target.closest('.perwrap'))drop.hidden=true;});

document.getElementById('rodape').innerHTML = D.nota +
  '<br>Previsão é o orçamento total de cada campanha e, nas diárias, o gasto mais a diária vezes os dias que faltam.' +
  '<br>Atualizado em ' + new Date(D.atualizado).toLocaleDateString('pt-BR') + ' às ' +
  new Date(D.atualizado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) +
  '. Fontes: Meta Marketing API, Google Ads API e painel do TikTok Ads. Esquina.';

const somaCli = c => ({
  gasto: c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.gasto,0),0),
  prev:  c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.previsao,0),0),
  plano: c.linhas.reduce((a,l)=>a+(l.plano||0),0)
});

function detalheHTML(c){
  return '<div class="det">' + c.linhas.map(l=>{
    const lg=l.campanhas.reduce((a,k)=>a+k.gasto,0), lp=l.campanhas.reduce((a,k)=>a+k.previsao,0);
    const rows=l.campanhas.map(k=>`<tr><td>${k.nome}</td><td class="num">${brl(k.gasto)}</td><td class="num prev">${brl(k.previsao)}</td></tr>`).join('');
    return `<div class="linha">
      <div class="lh"><span class="ln">${l.linha}</span>
      <span class="lp">${brl(lg)} gastos · previsão ${brl(lp)}${l.plano?` de ${brl(l.plano)} no plano`:''}</span></div>
      <div class="tbl"><table class="camp"><thead><tr><th>Campanha</th><th class="num">Gasto</th><th class="num">Previsão</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  }).join('') + '</div>';
}

function render(){
  const iv=intervalo(); document.getElementById('plabel').textContent=iv.label;
  const ms=mesesNo(iv);
  const soSetembro = ms.length===1 && ms[0]==='2026-09';
  const det = soSetembro ? D.detalhe['2026-09'] : null;
  document.getElementById('dica').textContent = det ? 'Clique na prefeitura para abrir as campanhas' : 'Detalhe por campanha disponível no ciclo de setembro';

  let gasto=0,prev=0,plano=0,nCamp=0;
  if(det){ det.forEach(c=>{const s=somaCli(c);gasto+=s.gasto;prev+=s.prev;plano+=s.plano;c.linhas.forEach(l=>nCamp+=l.campanhas.length);}); }
  else { Object.values(D.historico).forEach(h=>ms.forEach(m=>{if(h[m])gasto+=h[m];})); prev=gasto; }

  document.getElementById('totais').innerHTML=`
    <div class="kpi"><p class="l">Gasto no período</p><p class="v">${brl(gasto)}</p><p class="s">${det?nCamp+' campanhas no ar':'Meta Ads, total por prefeitura'}</p></div>
    <div class="kpi"><p class="l">Previsão até o fim</p><p class="v">${brl(prev)}</p><p class="s">${soSetembro?'ciclo em curso':'período encerrado'}</p></div>
    ${plano?`<div class="kpi"><p class="l">Previsto no plano</p><p class="v">${brl(plano)}</p><p class="s">Campinas não tem plano por linha</p></div>`:''}`;

  if(!det){
    const linhas=Object.entries(D.historico).map(([nome,h])=>{
      const v=ms.reduce((a,m)=>a+(h[m]||0),0);
      return v?`<tr class="cli"><td><div class="rowbtn" style="cursor:default"><span class="nome">${nome}</span><span class="num">${brl(v)}</span><span></span><span></span><span></span><span></span></div></td></tr>`:'';
    }).filter(Boolean).join('');
    document.getElementById('painel').innerHTML=`<table class="top"><thead><tr><th>Prefeitura</th></tr></thead><tbody>${linhas||'<tr><td style="padding:18px" class="na">Sem veiculação no período</td></tr>'}</tbody></table>`;
    return;
  }

  document.getElementById('painel').innerHTML = `<table class="top">
    <thead><tr><th>
      <div class="rowbtn" style="padding:0;cursor:default">
        <span>Prefeitura</span><span class="num">Plano</span><span class="num">Gasto</span>
        <span class="num colprev">Previsão</span><span class="colbar"></span><span></span>
      </div>
    </th></tr></thead>
    <tbody>${det.map((c,i)=>{
      const s=somaCli(c);
      const p = s.plano ? s.prev/s.plano*100 : null;
      return `<tr class="cli" data-i="${i}" data-open="${abertos.has(i)?1:0}">
        <td>
          <button class="rowbtn">
            <span class="nome">${c.cliente}<span class="flight">${c.flight}</span></span>
            <span class="num">${s.plano?brl(s.plano):'<span class="na">—</span>'}</span>
            <span class="num">${brl(s.gasto)}</span>
            <span class="num prev colprev">${brl(s.prev)}</span>
            <span class="colbar">${p!==null?`<div class="bar"><i style="width:${Math.min(p,100)}%"></i></div>`:''}</span>
            <span class="seta">▶</span>
          </button>
          ${abertos.has(i)?detalheHTML(c):''}
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;

  document.querySelectorAll('tr.cli .rowbtn').forEach(b=>{
    b.onclick=()=>{ const i=+b.closest('tr').dataset.i; abertos.has(i)?abertos.delete(i):abertos.add(i); render(); };
  });
}
render();
</script>
