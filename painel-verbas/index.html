<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F5F6F8; --card:#FFF; --ink:#12161C; --ink2:#5C6673; --mute:#8A94A6; --line:#E3E7EC;
  --accent:#1A3CFF; --bar:#EDF0F4;
  font-size:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding:0 16px 64px}
.wrap{max-width:1080px;margin:0 auto}
header{padding:44px 0 18px}
h1{font-size:clamp(1.9rem,4.2vw,2.6rem);margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:.9rem;margin:0;max-width:62ch}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:.82rem;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.perwrap{position:relative;display:inline-block;margin-left:auto}
.pbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font:inherit;font-size:.82rem;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.pbtn .car{font-size:.7rem;color:var(--mute)}
.drop{position:absolute;top:calc(100% + 8px);right:0;z-index:999;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:360px;box-shadow:0 8px 32px rgba(18,22,28,.12)}
.drop .cols{display:flex;gap:20px}
.drop .tt{font-size:.62rem;font-weight:700;color:var(--mute);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
.opt[data-on="1"]{background:rgba(26,60,255,.08)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;border:2px solid var(--mute);background:transparent}
.opt[data-on="1"] .dot{border-color:var(--accent);background:var(--accent)}
.opt span{font-size:.82rem;color:var(--ink2)}
.opt[data-on="1"] span{color:var(--ink)}
.custom{display:flex;flex-direction:column;gap:12px;flex:1;padding-top:26px;min-width:150px}
.custom label{display:block;font-size:.7rem;color:var(--mute);margin-bottom:5px}
.custom select{width:100%;font:inherit;font-size:.8rem;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.acoes button{font:inherit;font-size:.8rem;padding:7px 16px;border-radius:7px;cursor:pointer}
.acoes .can{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.acoes .apl{background:var(--accent);border:none;color:#fff;font-weight:600}
.totais{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.kpi .l{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.kpi .v{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0}
.kpi .s{font-size:.73rem;color:var(--ink2);margin:4px 0 0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 10px;margin:16px 0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;justify-content:space-between;margin-bottom:12px}
h2{font-size:1.1rem;margin:0;font-weight:600;letter-spacing:-.01em;text-transform:uppercase}
.flight{font-size:.76rem;color:var(--ink2)}
.tot{font-size:.8rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.linha{border-top:1px solid var(--line);padding:14px 0 6px}
.linha:first-of-type{border-top:none}
.lh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ln{font-size:.82rem;font-weight:600}
.lp{font-size:.74rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:6px 8px}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prev{color:var(--mute)}
.na{color:var(--ink2)}
.bar{height:5px;background:var(--bar);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
footer{color:var(--ink2);font-size:.76rem;padding:22px 4px;line-height:1.6}
@media (max-width:620px){ th:nth-child(4),td:nth-child(4){display:none} .drop{min-width:300px} .perwrap{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Painel de Verbas</h1>
  <p class="sub">Acompanhamento do gasto das prefeituras e autarquias. Escolha a prefeitura e o período para ver quanto cada campanha gastou, a previsão até o fim do ciclo e o valor previsto no plano.</p>
</header>
<div class="barra">
  <div class="chips" id="chips"></div>
  <div class="perwrap">
    <button class="pbtn" id="pbtn">📅 <span id="plabel"></span> <span class="car">▼</span></button>
    <div class="drop" id="drop" hidden>
      <div class="cols">
        <div style="min-width:150px">
          <div class="tt">Períodos</div>
          <div id="presets"></div>
        </div>
        <div class="custom" id="custom" hidden>
          <div><label>De</label><select id="mde"></select></div>
          <div><label>Até</label><select id="mate"></select></div>
        </div>
      </div>
      <div class="acoes">
        <button class="can" id="cancelar">Cancelar</button>
        <button class="apl" id="aplicar">Aplicar</button>
      </div>
    </div>
  </div>
</div>
<div class="totais" id="totais"></div>
<div id="conteudo"></div>
<footer id="rodape"></footer>
</div>

<script>
const D = JSON.parse(document.getElementById('dados').textContent);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const MESES = D.meses.map(m=>m.id).sort();
const nomeMes = id => D.meses.find(m=>m.id===id).nome;

const PRESETS = [
  {key:'mes-atual', label:'Este mês'},
  {key:'mes-passado', label:'Mês passado'},
  {key:'ytd', label:'2026 (YTD)'},
  {key:'personalizado', label:'Personalizado'},
];
let preset='mes-atual', de=MESES[MESES.length-1], ate=MESES[MESES.length-1];
let tp=preset, tde=de, tate=ate;
let cliente='todas';

function intervalo(){
  if(preset==='mes-atual') return {de:'2026-09', ate:'2026-09', label:'Este mês'};
  if(preset==='mes-passado') return {de:'2026-08', ate:'2026-08', label:'Mês passado'};
  if(preset==='ytd') return {de:MESES[0], ate:MESES[MESES.length-1], label:'2026 (YTD)'};
  return {de, ate, label: de===ate ? nomeMes(de) : nomeMes(de)+' a '+nomeMes(ate)};
}
function mesesNo(iv){ return MESES.filter(m=>m>=iv.de && m<=iv.ate); }

const clientes = ['todas', ...D.detalhe['2026-09'].map(c=>c.cliente)];
document.getElementById('chips').innerHTML = clientes.map(c=>
  `<button data-c="${c}" aria-pressed="${c===cliente}">${c==='todas'?'Todas':c}</button>`).join('');
document.getElementById('chips').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  cliente=b.dataset.c;
  document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===cliente));
  render();
});

const drop=document.getElementById('drop'), pbtn=document.getElementById('pbtn');
function pintaPresets(){
  document.getElementById('presets').innerHTML = PRESETS.map(p=>
    `<div class="opt" data-p="${p.key}" data-on="${tp===p.key?1:0}"><i class="dot"></i><span>${p.label}</span></div>`).join('');
  document.getElementById('custom').hidden = tp!=='personalizado';
}
function opcoesMes(sel,val){ sel.innerHTML=MESES.map(m=>`<option value="${m}"${m===val?' selected':''}>${nomeMes(m)}</option>`).join(''); }
pbtn.onclick = ()=>{ if(drop.hidden){ tp=preset; tde=de; tate=ate; pintaPresets(); opcoesMes(document.getElementById('mde'),tde); opcoesMes(document.getElementById('mate'),tate); drop.hidden=false; } else drop.hidden=true; };
document.getElementById('presets').addEventListener('click', e=>{ const o=e.target.closest('.opt'); if(!o) return; tp=o.dataset.p; pintaPresets(); });
document.getElementById('mde').onchange = e=>{ tde=e.target.value; };
document.getElementById('mate').onchange = e=>{ tate=e.target.value; };
document.getElementById('cancelar').onclick = ()=>{ drop.hidden=true; };
document.getElementById('aplicar').onclick = ()=>{
  preset=tp; if(tde>tate){ const x=tde; tde=tate; tate=x; } de=tde; ate=tate; drop.hidden=true; render();
};
document.addEventListener('click', e=>{ if(!drop.hidden && !e.target.closest('.perwrap')) drop.hidden=true; });

document.getElementById('rodape').innerHTML =
  D.nota + '<br>Previsão considera o orçamento total de cada campanha e, nas diárias, a diária vezes os dias que faltam até o término.<br>Atualizado em ' +
  new Date(D.atualizado).toLocaleDateString('pt-BR') + ' às ' + new Date(D.atualizado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) +
  '. Fontes: Meta Marketing API, Google Ads API e painel do TikTok Ads. Esquina.';

function render(){
  const iv = intervalo();
  document.getElementById('plabel').textContent = iv.label;
  const ms = mesesNo(iv);
  const soSetembro = ms.length===1 && ms[0]==='2026-09';
  let det = soSetembro ? D.detalhe['2026-09'] : null;
  if(det && cliente!=='todas') det = det.filter(c=>c.cliente===cliente);

  let gasto=0, prev=0, plano=0, nCamp=0;
  if(det){
    det.forEach(c=>c.linhas.forEach(l=>{ if(l.plano) plano+=l.plano; l.campanhas.forEach(k=>{gasto+=k.gasto;prev+=k.previsao;nCamp++;}); }));
  } else {
    Object.entries(D.historico).forEach(([nome,h])=>{
      if(cliente!=='todas' && !cliente.startsWith(nome) && !nome.startsWith(cliente.split(',')[0])) return;
      ms.forEach(m=>{ if(h[m]) gasto+=h[m]; });
    });
    prev=gasto;
  }

  document.getElementById('totais').innerHTML = `
    <div class="kpi"><p class="l">Gasto no período</p><p class="v">${brl(gasto)}</p><p class="s">${det?nCamp+' campanhas':'Meta Ads, total por prefeitura'}</p></div>
    <div class="kpi"><p class="l">Previsão até o fim</p><p class="v">${brl(prev)}</p><p class="s">${soSetembro?'ciclo em curso':'período encerrado'}</p></div>
    ${plano?`<div class="kpi"><p class="l">Previsto no plano</p><p class="v">${brl(plano)}</p><p class="s">Campinas não tem plano por linha</p></div>`:''}`;

  if(!det){
    const linhas = Object.entries(D.historico).map(([nome,h])=>{
      const v = ms.reduce((a,m)=>a+(h[m]||0),0);
      return v ? `<tr><td>${nome}</td><td class="num">${brl(v)}</td></tr>` : '';
    }).filter(Boolean).join('');
    document.getElementById('conteudo').innerHTML = `<section>
      <div class="head"><div><h2>${iv.label}</h2><span class="flight">gasto de Meta Ads por prefeitura</span></div></div>
      <div class="tbl"><table><thead><tr><th>Prefeitura</th><th class="num">Gasto</th></tr></thead><tbody>${linhas||'<tr><td colspan="2" class="na">Sem veiculação no período</td></tr>'}</tbody></table></div>
      <p class="sub" style="padding:14px 0">O detalhe campanha a campanha, com previsão e plano, está disponível no ciclo de setembro de 2026.</p>
    </section>`;
    return;
  }

  document.getElementById('conteudo').innerHTML = det.map(c=>{
    const cg=c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.gasto,0),0);
    const cp=c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.previsao,0),0);
    const cpl=c.linhas.reduce((a,l)=>a+(l.plano||0),0);
    const linhas=c.linhas.map(l=>{
      const lg=l.campanhas.reduce((a,k)=>a+k.gasto,0);
      const lp=l.campanhas.reduce((a,k)=>a+k.previsao,0);
      const rows=l.campanhas.map(k=>`<tr>
          <td>${k.nome}</td><td class="num">${brl(k.gasto)}</td><td class="num prev">${brl(k.previsao)}</td>
          <td>${l.plano?`<div class="bar"><i style="width:${Math.min(k.previsao/l.plano*100,100)}%"></i></div>`:''}</td></tr>`).join('');
      return `<div class="linha">
        <div class="lh"><span class="ln">${l.linha}</span>
        <span class="lp">${brl(lg)} gastos${l.plano?` · previsão ${brl(lp)} de ${brl(l.plano)} no plano · ${pct(lp/l.plano*100)}`:` · previsão ${brl(lp)}`}</span></div>
        <div class="tbl"><table><thead><tr><th>Campanha</th><th class="num">Gasto</th><th class="num">Previsão</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
    }).join('');
    return `<section>
      <div class="head"><div><h2>${c.cliente}</h2><span class="flight">${c.flight}</span></div>
      <span class="tot">${brl(cg)} gastos · previsão ${brl(cp)}${cpl?` · plano ${brl(cpl)}`:''}</span></div>
      ${linhas}</section>`;
  }).join('');
}
render();
</script>
