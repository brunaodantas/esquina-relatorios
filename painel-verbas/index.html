<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Verbas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --card:#FFF; --ink:#12161C; --ink2:#5C6673; --mute:#8A94A6; --line:#E3E7EC;
  --accent:#1A3CFF; --bar:#EDF0F4; --ok:#0F9D58; --warn:#C77700;
  font-size:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding:0 16px 64px}
.wrap{max-width:1000px;margin:0 auto}
header{padding:44px 0 16px}
h1{font-size:clamp(1.9rem,4.2vw,2.5rem);margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:.88rem;margin:0;max-width:60ch}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 4px;justify-content:space-between}
.perwrap{position:relative;display:inline-block}
.pbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font:inherit;font-size:.82rem;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.pbtn .car{font-size:.7rem;color:var(--mute)}
.drop{position:absolute;top:calc(100% + 8px);left:0;z-index:999;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:360px;box-shadow:0 8px 32px rgba(18,22,28,.12)}
.drop .cols{display:flex;gap:20px}
.drop .tt{font-size:.62rem;font-weight:700;color:var(--mute);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
.opt[data-on="1"]{background:rgba(26,60,255,.08)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;border:2px solid var(--mute);background:transparent}
.opt[data-on="1"] .dot{border-color:var(--accent);background:var(--accent)}
.opt span{font-size:.82rem;color:var(--ink2)}
.opt[data-on="1"] span{color:var(--ink)}
.custom{display:flex;flex-direction:column;gap:12px;flex:1;padding-top:26px;min-width:150px}
.custom label{display:block;font-size:.7rem;color:var(--mute);margin-bottom:5px}
.custom select{width:100%;font:inherit;font-size:.8rem;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.acoes button{font:inherit;font-size:.8rem;padding:7px 16px;border-radius:7px;cursor:pointer}
.acoes .can{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.acoes .apl{background:var(--accent);border:none;color:#fff;font-weight:600}
.dica{font-size:.76rem;color:var(--mute)}
.totais{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;min-width:0}
.kpi .l{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.kpi .v{font-size:clamp(1.2rem,2.1vw,1.6rem);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0}
.kpi .s{font-size:.72rem;color:var(--ink2);margin:4px 0 0}
.painel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:16px 0}
table.top{width:100%;border-collapse:collapse;font-size:.88rem}
table.top th{text-align:left;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line)}
table.top td{padding:0;border-bottom:1px solid var(--line)}
tr.cli:last-of-type td{border-bottom:none}
.rowbtn{display:grid;grid-template-columns:1.6fr .9fr .9fr .9fr 1fr 26px;gap:10px;align-items:center;width:100%;padding:14px 18px;background:none;border:none;font:inherit;text-align:left;cursor:pointer}
.rowbtn:hover{background:#FAFBFC}
.nome{font-weight:600}
.flight{display:block;font-size:.72rem;color:var(--mute);font-weight:400;margin-top:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prev{color:var(--mute)}
.pc{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.seta{color:var(--mute);font-size:.7rem;text-align:center;transition:transform .15s}
tr.cli[data-open="1"] .seta{transform:rotate(90deg)}
.det{background:#FAFBFC;padding:4px 18px 16px}
.linha{border-top:1px solid var(--line);padding:12px 0 4px}
.linha:first-child{border-top:none}
.lh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ln{font-size:.8rem;font-weight:600}
.lp{font-size:.72rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.tbl{width:100%;overflow-x:auto}
table.camp{width:100%;border-collapse:collapse;font-size:.8rem}
table.camp th{text-align:left;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:5px 8px}
table.camp td{padding:6px 8px;border-top:1px solid var(--line)}
.na{color:var(--mute)}

.perwrap[hidden]{display:none}
.vista{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.vista button{font:inherit;font-size:.8rem;font-weight:500;padding:6px 14px;border:none;border-radius:6px;background:none;color:var(--ink2);cursor:pointer}
.vista button[data-on="1"]{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chip{font:inherit;font-size:.76rem;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.chip[data-on="1"]{border-color:var(--accent);color:var(--accent);background:rgba(26,60,255,.06)}
.cl{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:16px 0;overflow:hidden}
.clh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.clh .nome{font-size:1.05rem}
.clh .tot{font-weight:700;font-variant-numeric:tabular-nums}
.pwrap{overflow-x:auto}
table.pl{width:100%;min-width:720px;border-collapse:collapse;font-size:.86rem}
table.pl th{text-align:left;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.pl th.num,table.pl td.num{text-align:right}
table.pl tr.pr>td{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
table.pl tr.pr:hover>td{background:#FAFBFC}
table.pl td.pp{font-weight:600}
table.pl td.pp small{display:block;font-weight:400;color:var(--mute);font-size:.72rem;margin-top:2px}
table.pl tr.dt>td{padding:0;background:#FAFBFC;border-bottom:1px solid var(--line)}
.dtin{padding:8px 12px 14px 28px}
.dtin .nt{font-size:.74rem;color:var(--ink2);margin:2px 0 8px}
.dtin .ft{font-size:.68rem;color:var(--mute);margin:8px 0 0}
table.camp td.plat{color:var(--mute);width:80px}
tr.pr .car2{display:inline-block;color:var(--mute);font-size:.65rem;margin-right:6px;transition:transform .15s}
tr.pr[data-open="1"] .car2{transform:rotate(90deg)}

.diactl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin:12px 0 2px}
.dflds{display:flex;gap:10px}
.dflds label{display:flex;flex-direction:column;font-size:.68rem;color:var(--mute);gap:4px}
.dflds input{font:inherit;font-size:.86rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.diactl .chips{margin:0}
.diactl[hidden]{display:none}
table.dias{width:100%;min-width:560px;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
table.dias th{text-align:right;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
table.dias th:first-child,table.dias td:first-child{text-align:left}
table.dias td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right}
table.dias tr.wk td{color:var(--mute)}
.scr{max-height:420px;overflow:auto}
.sec{font-size:.78rem;font-weight:600;color:var(--ink2);letter-spacing:.04em;margin:22px 2px 6px;text-transform:uppercase}
footer{color:var(--ink2);font-size:.76rem;padding:22px 4px;line-height:1.6}
@media (max-width:720px){
  .rowbtn{grid-template-columns:1.4fr .9fr .9fr 22px;gap:8px}
  .rowbtn .colprev,.rowbtn .colbar,th.colprev,th.colbar{display:none}
  .drop{min-width:290px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Painel de Verbas</h1>
  <p class="sub">Quanto cada prefeitura gastou em cada programa e período, e quanto cada campanha gastou. Clique numa linha para abrir as campanhas.</p>
</header>
<div class="barra">
  <div class="vista" id="vista"><button data-v="periodo">Por período</button><button data-v="dia">Por dia</button><button data-v="mes">Por mês</button></div>
  <div class="perwrap">
    <button class="pbtn" id="pbtn">📅 <span id="plabel"></span> <span class="car">▼</span></button>
    <div class="drop" id="drop" hidden>
      <div class="cols">
        <div style="min-width:150px">
          <div class="tt">Períodos</div>
          <div id="presets"></div>
        </div>
        <div class="custom" id="custom" hidden>
          <div><label>De</label><select id="mde"></select></div>
          <div><label>Até</label><select id="mate"></select></div>
        </div>
      </div>
      <div class="acoes">
        <button class="can" id="cancelar">Cancelar</button>
        <button class="apl" id="aplicar">Aplicar</button>
      </div>
    </div>
  </div>
  <span class="dica" id="dica"></span>
</div>
<div class="diactl" id="diactl" hidden>
  <div class="dflds"><label>De<input type="date" id="dde"></label><label>Até<input type="date" id="date_"></label></div>
  <div class="chips" id="dpre"></div>
</div>
<div class="totais" id="totais"></div>
<div class="painel" id="painel"></div>
<footer><span id="notaPeriodo"></span><div id="rodape"></div></footer>
</div>

<script>
const D = JSON.parse(document.getElementById('dados').textContent);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+'%';
const MESES = D.meses.map(m=>m.id).sort();
const nomeMes = id => D.meses.find(m=>m.id===id).nome;

const PRESETS=[{key:'mes-atual',label:'Este mês'},{key:'mes-passado',label:'Mês passado'},{key:'ytd',label:'2026 (YTD)'},{key:'personalizado',label:'Personalizado'}];
let preset='mes-atual', de=MESES[MESES.length-1], ate=MESES[MESES.length-1];
let tp=preset,tde=de,tate=ate;
const abertos = new Set();

function intervalo(){
  if(preset==='mes-atual') return {de:MESES[MESES.length-1],ate:MESES[MESES.length-1],label:'Este mês'};
  if(preset==='mes-passado') return {de:MESES[MESES.length-2],ate:MESES[MESES.length-2],label:'Mês passado'};
  if(preset==='ytd') return {de:MESES[0],ate:MESES[MESES.length-1],label:'2026 (YTD)'};
  return {de,ate,label: de===ate?nomeMes(de):nomeMes(de)+' a '+nomeMes(ate)};
}
const mesesNo = iv => MESES.filter(m=>m>=iv.de&&m<=iv.ate);

const drop=document.getElementById('drop'),pbtn=document.getElementById('pbtn');
function pintaPresets(){
  document.getElementById('presets').innerHTML=PRESETS.map(p=>`<div class="opt" data-p="${p.key}" data-on="${tp===p.key?1:0}"><i class="dot"></i><span>${p.label}</span></div>`).join('');
  document.getElementById('custom').hidden = tp!=='personalizado';
}
const opcoesMes=(sel,val)=>sel.innerHTML=MESES.map(m=>`<option value="${m}"${m===val?' selected':''}>${nomeMes(m)}</option>`).join('');
pbtn.onclick=()=>{ if(drop.hidden){tp=preset;tde=de;tate=ate;pintaPresets();opcoesMes(document.getElementById('mde'),tde);opcoesMes(document.getElementById('mate'),tate);drop.hidden=false;} else drop.hidden=true; };
document.getElementById('presets').addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;tp=o.dataset.p;pintaPresets();});
document.getElementById('mde').onchange=e=>tde=e.target.value;
document.getElementById('mate').onchange=e=>tate=e.target.value;
document.getElementById('cancelar').onclick=()=>drop.hidden=true;
document.getElementById('aplicar').onclick=()=>{preset=tp;if(tde>tate){const x=tde;tde=tate;tate=x;}de=tde;ate=tate;drop.hidden=true;render();};
document.addEventListener('click',e=>{if(!drop.hidden&&!e.composedPath().some(el=>el.classList&&el.classList.contains('perwrap')))drop.hidden=true;});

document.getElementById('notaPeriodo').textContent = D.nota_periodo;
document.getElementById('rodape').innerHTML = D.nota +
  '<br>' + (D.previsao_regra||'') + '<br>Em setembro, a previsão é o orçamento total de cada campanha e, nas diárias, o gasto mais a diária vezes os dias que faltam.' +
  '<br>Atualizado em ' + new Date(D.atualizado).toLocaleDateString('pt-BR') + ' às ' +
  new Date(D.atualizado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) +
  '. Fontes: Meta Marketing API, Google Ads API e painel do TikTok Ads. Esquina.';

const somaCli = c => ({
  gasto: c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.gasto,0),0),
  prev:  c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.previsao,0),0),
  plano: c.linhas.reduce((a,l)=>a+(l.plano||0),0)
});

function detalheHTML(c){
  return '<div class="det">' + c.linhas.map(l=>{
    const lg=l.campanhas.reduce((a,k)=>a+k.gasto,0), lp=l.campanhas.reduce((a,k)=>a+k.previsao,0);
    const rows=l.campanhas.map(k=>`<tr><td>${k.nome}</td><td class="num">${brl(k.gasto)}</td><td class="num prev">${brl(k.previsao)}</td></tr>`).join('');
    return `<div class="linha">
      <div class="lh"><span class="ln">${l.linha}</span>
      <span class="lp">${brl(lg)} gastos · previsão ${brl(lp)}${l.plano?` de ${brl(l.plano)} no plano`:''}</span></div>
      <div class="tbl"><table class="camp"><thead><tr><th>Campanha</th><th class="num">Gasto</th><th class="num">Previsão</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  }).join('') + '</div>';
}

function render(){
  pintaVista();
  if(vista==='periodo'){renderPeriodo();return;}
  if(vista==='dia'){renderDia();return;}
  const iv=intervalo(); document.getElementById('plabel').textContent=iv.label;
  const ms=mesesNo(iv);
  const mesAberto = ms.length===1 && (D.meses.find(x=>x.id===ms[0])||{}).aberto;
  const det = ms.length===1 ? (D.detalhe[ms[0]]||null) : null;
  document.getElementById('dica').textContent = det ? 'Clique na prefeitura para abrir as campanhas' : 'Detalhe por campanha disponível para setembro e outubro';

  let gasto=0,prev=0,plano=0,nCamp=0;
  if(det){ det.forEach(c=>{const s=somaCli(c);gasto+=s.gasto;prev+=s.prev;plano+=s.plano;c.linhas.forEach(l=>nCamp+=l.campanhas.length);}); }
  else { Object.values(D.historico).forEach(h=>ms.forEach(m=>{if(h[m])gasto+=h[m];})); prev=gasto; }

  document.getElementById('totais').innerHTML=`
    <div class="kpi"><p class="l">Gasto no período</p><p class="v">${brl(gasto)}</p><p class="s">${det?nCamp+' campanhas no ar':'Meta Ads, total por prefeitura'}</p></div>
    <div class="kpi"><p class="l">Previsão até o fim</p><p class="v">${brl(prev)}</p><p class="s">${mesAberto?'mês em curso':'período encerrado'}</p></div>
    ${plano?`<div class="kpi"><p class="l">Previsto no plano</p><p class="v">${brl(plano)}</p><p class="s">Campinas não tem plano por linha</p></div>`:''}`;

  if(!det){
    const linhas=Object.entries(D.historico).map(([nome,h])=>{
      const v=ms.reduce((a,m)=>a+(h[m]||0),0);
      return v?`<tr class="cli"><td><div class="rowbtn" style="cursor:default"><span class="nome">${nome}</span><span class="num">${brl(v)}</span><span></span><span></span><span></span><span></span></div></td></tr>`:'';
    }).filter(Boolean).join('');
    document.getElementById('painel').innerHTML=`<table class="top"><thead><tr><th>Prefeitura</th></tr></thead><tbody>${linhas||'<tr><td style="padding:18px" class="na">Sem veiculação no período</td></tr>'}</tbody></table>`;
    return;
  }

  document.getElementById('painel').innerHTML = `<table class="top">
    <thead><tr><th>
      <div class="rowbtn" style="padding:0;cursor:default">
        <span>Prefeitura</span><span class="num">Plano</span><span class="num">Gasto</span>
        <span class="num colprev">Previsão</span><span class="colbar"></span><span></span>
      </div>
    </th></tr></thead>
    <tbody>${det.map((c,i)=>{
      const s=somaCli(c);
      const p = s.plano ? s.prev/s.plano*100 : null;
      return `<tr class="cli" data-i="${i}" data-open="${abertos.has(i)?1:0}">
        <td>
          <button class="rowbtn">
            <span class="nome">${c.cliente}<span class="flight">${c.flight}</span></span>
            <span class="num">${s.plano?brl(s.plano):'<span class="na">—</span>'}</span>
            <span class="num">${brl(s.gasto)}</span>
            <span class="num prev colprev">${brl(s.prev)}</span>
            <span class="colbar">${p!==null?`<div class="bar"><i style="width:${Math.min(p,100)}%"></i></div>`:''}</span>
            <span class="seta">▶</span>
          </button>
          ${abertos.has(i)?detalheHTML(c):''}
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;

  document.querySelectorAll('tr.cli .rowbtn').forEach(b=>{
    b.onclick=()=>{ const i=+b.closest('tr').dataset.i; abertos.has(i)?abertos.delete(i):abertos.add(i); render(); };
  });
}

let vista='periodo', clienteSel='Todas';
const abertosP = new Set();
const PLAT=['Meta','Google','YouTube','TikTok','Outras'];
const somaPlat = (cs,p)=>cs.filter(k=>k.p===p).reduce((a,k)=>a+k.g,0);
const somaL = l=>l.campanhas.reduce((a,k)=>a+k.g,0);
function renderPeriodo(){
  const P=D.periodos;
  const lista = clienteSel==='Todas'?P:P.filter(c=>c.nome===clienteSel||c.cliente===clienteSel);
  let tot={Meta:0,Google:0,YouTube:0,TikTok:0,Outras:0},geral=0,nl=0;
  lista.forEach(c=>c.linhas.forEach(l=>{nl++;PLAT.forEach(p=>{tot[p]+=somaPlat(l.campanhas,p);});geral+=somaL(l);}));
  document.getElementById('plabel').textContent='';
  document.getElementById('dica').textContent='Clique numa linha para ver o gasto de cada campanha';
  document.getElementById('totais').innerHTML=`
    <div class="kpi"><p class="l">Gasto nas linhas</p><p class="v">${brl(geral)}</p><p class="s">${nl} programas e períodos</p></div>
    <div class="kpi"><p class="l">Meta Ads</p><p class="v">${brl(tot.Meta)}</p></div>
    <div class="kpi"><p class="l">Google Ads</p><p class="v">${brl(tot.Google)}</p></div>
    <div class="kpi"><p class="l">YouTube</p><p class="v">${brl(tot.YouTube)}</p></div>
    <div class="kpi"><p class="l">TikTok</p><p class="v">${brl(tot.TikTok)}</p>${tot.Outras?`<p class="s">mais ${brl(tot.Outras)} em outras mídias</p>`:''}</div>`;
  const chips='<div class="chips">'+['Todas',...P.map(c=>c.cliente)].map(n=>`<button class="chip" data-c="${n}" data-on="${n===clienteSel?1:0}">${n}</button>`).join('')+'</div>';
  const secs=lista.map(c=>{
    const ct=c.linhas.reduce((a,l)=>a+somaL(l),0);
    const rows=c.linhas.map((l,i)=>{
      const key=c.cliente+'|'+i, open=abertosP.has(key);
      const t=somaL(l);
      const cell=p=>{const v=somaPlat(l.campanhas,p);return `<td class="num">${v?brl(v):'<span class="na"></span>'}</td>`;};
      const det=open?`<tr class="dt"><td colspan="6"><div class="dtin">${l.nota?`<p class="nt">${l.nota}</p>`:''}
        ${l.campanhas.length?`<table class="camp"><thead><tr><th>Campanha</th><th>Plataforma</th><th class="num">Gasto</th></tr></thead><tbody>${l.campanhas.map(k=>`<tr><td>${k.n}</td><td class="plat">${k.p}</td><td class="num">${brl(k.g)}</td></tr>`).join('')}</tbody></table>`:'<p class="nt">Sem campanhas com gasto.</p>'}
        <p class="ft">Fonte: ${l.fonte}</p></div></td></tr>`:'';
      return `<tr class="pr" data-k="${key}" data-open="${open?1:0}"><td class="pp"><span class="car2">▶</span>${l.programa}<small>${l.periodo}</small></td>${cell('Meta')}${cell('Google')}${cell('YouTube')}${cell('TikTok')}<td class="num"><b>${brl(t)}</b></td></tr>${det}`;
    }).join('');
    return `<section class="cl"><div class="clh"><span class="nome"><b>${c.cliente}</b></span><span class="tot">${brl(ct)}</span></div>
      <div class="pwrap"><table class="pl"><thead><tr><th>Programa e período</th><th class="num">Meta Ads</th><th class="num">Google Ads</th><th class="num">YouTube</th><th class="num">TikTok</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join('');
  document.getElementById('painel').className='';
  document.getElementById('painel').innerHTML=chips+secs;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{clienteSel=b.dataset.c;render();});
  document.querySelectorAll('tr.pr').forEach(r=>r.onclick=()=>{const k=r.dataset.k;abertosP.has(k)?abertosP.delete(k):abertosP.add(k);render();});
}
function pintaVista(){
  document.querySelectorAll('#vista button').forEach(b=>b.dataset.on=b.dataset.v===vista?1:0);
  document.querySelector('.perwrap').hidden = vista!=='mes';
  document.getElementById('diactl').hidden = vista!=='dia';
  document.getElementById('notaPeriodo').hidden = vista==='mes';
  document.getElementById('notaPeriodo').textContent = vista==='dia'?D.nota_dia:D.nota_periodo;
  document.getElementById('painel').className = vista==='mes'?'painel':'';
}
document.querySelectorAll('#vista button').forEach(b=>b.onclick=()=>{vista=b.dataset.v;render();});

// ---- visão por dia
const BASE=Date.UTC(2025,11,16);
const idx=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-BASE)/864e5);};
const iso=i=>new Date(BASE+i*864e5).toISOString().slice(0,10);
const br=s=>s.slice(8,10)+'/'+s.slice(5,7);
const DIA_MIN='2025-12-16', DIA_MAX=(D.dias_ate||'2026-10-28');
let dde=DIA_MAX.slice(0,8)+'01', date_=DIA_MAX, diaCli='Todas';
const DPRE=[['7 dias',()=>[iso(idx(DIA_MAX)-6),DIA_MAX]],['30 dias',()=>[iso(idx(DIA_MAX)-29),DIA_MAX]],['Este mês',()=>[DIA_MAX.slice(0,8)+'01',DIA_MAX]],['Mês passado',()=>{const i=idx(DIA_MAX.slice(0,8)+'01');const f=iso(i-1);return [f.slice(0,8)+'01',f];}],['Tudo',()=>[DIA_MIN,DIA_MAX]]];
function renderDia(){
  const dias=D.dias||{};
  const ci=document.getElementById('dde'), cf=document.getElementById('date_');
  ci.min=cf.min=DIA_MIN; ci.max=cf.max=DIA_MAX; ci.value=dde; cf.value=date_;
  ci.onchange=()=>{if(ci.value){dde=ci.value;if(dde>date_)date_=dde;render();}};
  cf.onchange=()=>{if(cf.value){date_=cf.value;if(dde>date_)dde=date_;render();}};
  document.getElementById('dpre').innerHTML=DPRE.map((p,i)=>`<button class="chip" data-i="${i}">${p[0]}</button>`).join('');
  document.querySelectorAll('#dpre .chip').forEach(b=>b.onclick=()=>{const r=DPRE[+b.dataset.i][1]();dde=r[0];date_=r[1];render();});
  document.getElementById('plabel').textContent='';
  const a=idx(dde), b=idx(date_), n=b-a+1;
  const nomes=Object.keys(dias);
  const porCli={}; const dia=PLAT.map(()=>null);
  const tot={}, diaTot={};
  nomes.forEach(c=>{
    const camps=[];const dd=new Array(n).fill(0).map(()=>({Meta:0,Google:0,YouTube:0,TikTok:0,Outras:0}));
    dias[c].forEach(s=>{let g=0;const s0=idx(s.s);for(let k=0;k<s.v.length;k++){const t=s0+k;if(t>=a&&t<=b){g+=s.v[k];dd[t-a][s.p]+=s.v[k];}}
      if(g>0.004)camps.push({n:s.n,p:s.p,g});});
    camps.sort((x,y)=>y.g-x.g);
    porCli[c]={camps,dd,t:camps.reduce((x,k)=>x+k.g,0)};
  });
  const lista=diaCli==='Todas'?nomes:[diaCli];
  const T={Meta:0,Google:0,YouTube:0,TikTok:0,Outras:0};let geral=0;
  lista.forEach(c=>porCli[c].camps.forEach(k=>{T[k.p]+=k.g;geral+=k.g;}));
  document.getElementById('dica').textContent=`${br(dde)}/${dde.slice(0,4)} a ${br(date_)}/${date_.slice(0,4)} · ${n} dia${n>1?'s':''}`;
  document.getElementById('totais').innerHTML=`
    <div class="kpi"><p class="l">Gasto no intervalo</p><p class="v">${brl(geral)}</p><p class="s">${n} dia${n>1?'s':''}</p></div>
    <div class="kpi"><p class="l">Meta Ads</p><p class="v">${brl(T.Meta)}</p></div>
    <div class="kpi"><p class="l">Google Ads</p><p class="v">${brl(T.Google)}</p></div>
    <div class="kpi"><p class="l">YouTube</p><p class="v">${brl(T.YouTube)}</p></div>
    <div class="kpi"><p class="l">TikTok</p><p class="v">${brl(T.TikTok)}</p></div>`;
  const chips='<div class="chips">'+['Todas',...nomes].map(x=>`<button class="chip" data-c="${x}" data-on="${x===diaCli?1:0}">${x}</button>`).join('')+'</div>';
  // tabela por dia
  let linhas='';
  for(let i=n-1;i>=0;i--){
    const r={Meta:0,Google:0,YouTube:0,TikTok:0,Outras:0};
    lista.forEach(c=>PLAT.forEach(p=>{r[p]+=porCli[c].dd[i][p];}));
    const t=PLAT.reduce((x,p)=>x+r[p],0);
    const ds=iso(a+i), w=new Date(BASE+(a+i)*864e5).getUTCDay();
    const c=v=>v>0.004?brl(v):'';
    linhas+=`<tr class="${w===0||w===6?'wk':''}"><td>${br(ds)} ${['dom','seg','ter','qua','qui','sex','sáb'][w]}</td><td>${c(r.Meta)}</td><td>${c(r.Google)}</td><td>${c(r.YouTube)}</td><td>${c(r.TikTok)}</td><td><b>${c(t)}</b></td></tr>`;
  }
  const tabDia=`<p class="sec">Gasto por dia</p><div class="cl"><div class="pwrap scr"><table class="dias"><thead><tr><th>Dia</th><th>Meta Ads</th><th>Google Ads</th><th>YouTube</th><th>TikTok</th><th>Total</th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
  const camp=lista.map(c=>{const o=porCli[c];if(!o.camps.length)return '';
    return `<section class="cl"><div class="clh"><span class="nome"><b>${c}</b></span><span class="tot">${brl(o.t)}</span></div><div class="pwrap"><table class="pl" style="min-width:560px"><thead><tr><th>Campanha</th><th>Plataforma</th><th class="num">Gasto no intervalo</th></tr></thead><tbody>${o.camps.map(k=>`<tr><td style="padding:9px 12px;border-bottom:1px solid var(--line)">${k.n}</td><td style="padding:9px 12px;border-bottom:1px solid var(--line);color:var(--mute)">${k.p}</td><td class="num" style="padding:9px 12px;border-bottom:1px solid var(--line)">${brl(k.g)}</td></tr>`).join('')}</tbody></table></div></section>`;}).join('');
  document.getElementById('painel').className='';
  document.getElementById('painel').innerHTML=chips+tabDia+'<p class="sec">Gasto por campanha no intervalo</p>'+(camp||'<p class="nt">Sem gasto no intervalo.</p>');
  document.querySelectorAll('#painel .chip').forEach(bt=>bt.onclick=()=>{diaCli=bt.dataset.c;render();});
}

render();
</script>
