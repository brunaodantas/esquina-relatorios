<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F5F6F8; --card:#FFF; --ink:#12161C; --ink2:#5C6673; --line:#E3E7EC;
  --accent:#1A3CFF; --prev:#8A94A6; --bar:#EDF0F4;
  font-size:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding:0 16px 64px}
.wrap{max-width:1080px;margin:0 auto}
header{padding:44px 0 18px}
h1{font-size:clamp(1.9rem,4.2vw,2.6rem);margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:.9rem;margin:0;max-width:62ch}
.stamp{display:inline-block;margin-top:14px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.periodo{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.periodo button{font:inherit;font-size:.82rem;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.periodo button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.totais{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.kpi .l{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.kpi .v{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0}
.kpi .s{font-size:.73rem;color:var(--ink2);margin:4px 0 0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 10px;margin:16px 0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;justify-content:space-between;margin-bottom:12px}
h2{font-size:1.12rem;margin:0;font-weight:600;letter-spacing:-.01em;text-transform:uppercase}
.flight{font-size:.76rem;color:var(--ink2)}
.tot{font-size:.8rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.linha{border-top:1px solid var(--line);padding:14px 0 6px}
.linha:first-of-type{border-top:none}
.lh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ln{font-size:.82rem;font-weight:600}
.lp{font-size:.74rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:6px 8px}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prev{color:var(--prev)}
.na{color:var(--ink2)}
.bar{height:5px;background:var(--bar);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
footer{color:var(--ink2);font-size:.76rem;padding:22px 4px;line-height:1.6}
@media (max-width:620px){ th:nth-child(4),td:nth-child(4){display:none} }
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('dados').textContent);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
let atual = D.meses[0].id;

const dt = new Date(D.atualizado);
document.getElementById('stamp').textContent =
  'Atualizado em ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
document.getElementById('rodape').innerHTML =
  D.nota + '<br>Previsão considera o orçamento total de cada campanha e, nas diárias, a diária vezes os dias que faltam até o término.<br>Fontes: Meta Marketing API, Google Ads API e painel do TikTok Ads. Esquina.';

document.getElementById('periodo').innerHTML = D.meses.map(m =>
  `<button data-id="${m.id}" aria-pressed="${m.id===atual}">${m.nome}${m.aberto?' · em curso':''}</button>`).join('');
document.getElementById('periodo').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  atual = b.dataset.id;
  document.querySelectorAll('#periodo button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.id===atual));
  render();
});

function render(){
  const det = D.detalhe[atual];
  const mes = D.meses.find(m=>m.id===atual);
  let gastoTot=0, prevTot=0, planoTot=0, nCamp=0;

  if(det){
    det.forEach(c=>c.linhas.forEach(l=>{
      if(l.plano) planoTot+=l.plano;
      l.campanhas.forEach(k=>{gastoTot+=k.gasto; prevTot+=k.previsao; nCamp++;});
    }));
  } else {
    Object.values(D.historico).forEach(h=>{ if(h[atual]) gastoTot+=h[atual]; });
    prevTot = gastoTot;
  }

  document.getElementById('totais').innerHTML = `
    <div class="kpi"><p class="l">Gasto no período</p><p class="v">${brl(gastoTot)}</p><p class="s">${det?nCamp+' campanhas':'todas as contas'}</p></div>
    <div class="kpi"><p class="l">Previsão até o fim</p><p class="v">${brl(prevTot)}</p><p class="s">${mes.aberto?'ciclo em curso':'ciclo encerrado'}</p></div>
    ${planoTot?`<div class="kpi"><p class="l">Previsto no plano</p><p class="v">${brl(planoTot)}</p><p class="s">sem Campinas, que não tem plano por linha</p></div>`:''}`;

  if(!det){
    const linhas = Object.entries(D.historico)
      .filter(([,h])=>h[atual])
      .sort((a,b)=>b[1][atual]-a[1][atual])
      .map(([nome,h])=>`<tr><td>${nome}</td><td class="num">${brl(h[atual])}</td></tr>`).join('');
    document.getElementById('conteudo').innerHTML = `<section>
      <div class="head"><div><h2>${mes.nome}</h2><span class="flight">gasto de Meta Ads por prefeitura</span></div></div>
      <div class="tbl"><table><thead><tr><th>Prefeitura</th><th class="num">Gasto</th></tr></thead><tbody>${linhas||'<tr><td colspan="2" class="na">Sem veiculação no período</td></tr>'}</tbody></table></div>
    </section>
    <section><div class="head"><div><h2>Detalhe por campanha</h2><span class="flight">disponível a partir de setembro de 2026</span></div></div>
    <p class="sub" style="padding-bottom:14px">Para os meses anteriores o painel traz o total por prefeitura. O detalhe campanha a campanha começa no ciclo de setembro.</p></section>`;
    return;
  }

  document.getElementById('conteudo').innerHTML = det.map(c=>{
    const cg = c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.gasto,0),0);
    const cp = c.linhas.reduce((a,l)=>a+l.campanhas.reduce((x,k)=>x+k.previsao,0),0);
    const cpl = c.linhas.reduce((a,l)=>a+(l.plano||0),0);
    const linhas = c.linhas.map(l=>{
      const lg = l.campanhas.reduce((a,k)=>a+k.gasto,0);
      const lp = l.campanhas.reduce((a,k)=>a+k.previsao,0);
      const rows = l.campanhas.map(k=>`<tr>
          <td>${k.nome}</td>
          <td class="num">${brl(k.gasto)}</td>
          <td class="num prev">${brl(k.previsao)}</td>
          <td>${l.plano?`<div class="bar"><i style="width:${Math.min(k.previsao/l.plano*100,100)}%"></i></div>`:''}</td>
        </tr>`).join('');
      return `<div class="linha">
        <div class="lh">
          <span class="ln">${l.linha}</span>
          <span class="lp">${brl(lg)} gastos${l.plano?` · previsão ${brl(lp)} de ${brl(l.plano)} no plano · ${pct(lp/l.plano*100)}`:` · previsão ${brl(lp)}`}</span>
        </div>
        <div class="tbl"><table>
          <thead><tr><th>Campanha</th><th class="num">Gasto</th><th class="num">Previsão</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
    }).join('');
    return `<section>
      <div class="head">
        <div><h2>${c.cliente}</h2><span class="flight">${c.flight}</span></div>
        <span class="tot">${brl(cg)} gastos · previsão ${brl(cp)}${cpl?` · plano ${brl(cpl)}`:''}</span>
      </div>
      ${linhas}
    </section>`;
  }).join('');
}
render();
</script>
</body>
</html>
