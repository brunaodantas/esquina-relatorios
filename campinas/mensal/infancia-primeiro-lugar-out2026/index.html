.track .fill.brk::after{content:"";position:absolute;right:22px;top:-3px;bottom:-3px;width:8px;background:var(--white);transform:skewX(-20deg)}
.s-dark .track .fill.brk::after{background:var(--black)}

.ixg{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;margin-top:14px}
.ixc-h{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:3px;text-transform:uppercase;margin:0;padding-bottom:10px;border-bottom:1px solid var(--black)}
.ixc-a .ixc-h{color:var(--accent-deep)}.ixc-b .ixc-h{color:var(--gray-600)}
.ixr{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--gray-200)}
.ixr:last-child{border-bottom:none}
.ixr-img{width:52px;height:52px;border-radius:6px;background:center/cover no-repeat var(--gray-200)}
.ixr-n{font-family:var(--sans);font-weight:700;font-size:16px;line-height:1.2;margin:0 0 6px}
.ixr-ch{display:flex;flex-wrap:wrap;gap:6px}
.ixr-ch span{font-family:var(--sans);font-weight:600;font-size:15px;line-height:1;padding:5px 10px;border-radius:999px;background:var(--gray-100);color:var(--gray-800)}
.ixc-a .ixr-ch span{background:rgba(55,0,255,.08);color:var(--accent-deep)}
.ixr-v{font-family:var(--sans);font-weight:800;font-size:30px;line-height:1;color:var(--accent-deep);text-align:right;min-width:56px}
.ixc-b .ixr-v{color:var(--gray-800)}
@media (min-width:901px) and (max-height:780px){.ixr{padding:6px 0;grid-template-columns:44px 1fr auto}.ixr-img{width:44px;height:44px}.ixr-n{margin-bottom:4px}.ixr-ch span{padding:4px 9px}.ixr-v{font-size:26px}}
@media (max-width:900px){.ixg{grid-template-columns:1fr;gap:24px}}

@media (min-width:901px) and (max-height:800px){.aud-r{grid-template-columns:minmax(110px,42%) 1fr 44px!important;gap:0 8px!important}.aud-n{grid-column:auto!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aud{gap:8px!important}}

.tm-g{display:grid;grid-template-columns:5fr 6fr;gap:0 56px;margin-top:10px;align-items:start}
.tm-h{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--gray-400);margin:0 0 8px}
.tm-big{font-family:var(--sans);font-weight:800;font-size:clamp(40px,4.4vw,64px);line-height:1;letter-spacing:-2px;color:var(--accent-on-dark);margin:0}
.tm-pill{display:inline-block;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;margin:12px 0 14px;color:var(--white)}
.tm-dl{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}

      ${D.metas.map(m => { const pct = m.entregue / m.meta * 100; const pb = Math.min(pct, CAP); const tick = 100 / scale * 100; return `<div class="goal"><p class="g-label">${esc(m.linha)}<span>meta ${fmt(m.meta)} · entregue ${fmt(m.entregue)}</span></p><div class="track"><span class="tick" style="left:${tick.toFixed(2)}%"><i>100%</i></span><span class="fill${pct > CAP ? " brk" : ""}" data-w="${(pb / scale * 100).toFixed(2)}"><span class="fa" style="width:${(Math.min(pb, 100) / pb * 100).toFixed(2)}%"></span><span class="fb" style="width:${(Math.max(pb - 100, 0) / pb * 100).toFixed(2)}%"></span></span></div><p class="g-pct">${pct.toFixed(1).replace(".", ",")}%</p></div>`; }).join("")}
    </div>`));

  
  {
    const UN = D.temasUnidade || "tema";
    const PAL = ["#d431a1", "#024BD7", "#17A697", "#EA5B0C", "#E3B505", "#9D6BE8", "#5B8EF0", "#3D3DA0"];  
    const num = x => { const n = parseInt(String(x).replace(/\./g, ""), 10); return isNaN(n) ? 0 : n; };
    const f = n => n.toLocaleString("pt-BR");
    const T = {}, ord = [];
    D.temas.forEach(r => { const k = String(r[0]).split(" · ")[0]; if (!T[k]) { T[k] = { imp: 0, eng: 0, vis: 0, dsp: 0 }; ord.push(k); } T[k].imp += num(r[2]); T[k].eng += num(r[3]); T[k].vis += num(r[4]); T[k].dsp += num(r[5]); });
    ord.sort((a, b) => T[b].imp - T[a].imp);
    const col = {}; ord.forEach((k, i) => col[k] = PAL[i % PAL.length]);
    const tot = ord.reduce((a, k) => a + T[k].imp, 0);
    let acc = 0; const stops = ord.map(k => { const a = acc / tot * 360; acc += T[k].imp; return `${col[k]} ${a.toFixed(2)}deg ${(acc / tot * 360).toFixed(2)}deg`; }).join(",");
    const barras = (lab, key) => { const L = ord.filter(k => T[k][key] > 0).sort((a, b) => T[b][key] - T[a][key]); if (!L.length) return ""; const mx = T[L[0]][key];
      return `<div class="tm-bl"><p class="tm-h">${lab}</p>${L.map(k => `<div class="tm-r"><span class="tm-n">${k}</span><span class="tm-t"><span style="width:${Math.max(T[k][key] / mx * 100, 1.5).toFixed(1)}%;background:${col[k]}"></span></span><b>${f(T[k][key])}</b></div>`).join("")}</div>`; };
    slide("s-dark s-media tmslide", "As campanhas do mês", grid(head(tag(["Entrega por " + UN + " · ", MED, " · " + D.periodo]), D.temasTitulo[0], D.temasTitulo[1]) + `
      <div class="col-span-10 tm-g${ord.length > 6 ? " tm-many" : ""} anim d2">
        <div class="tm-l"><p class="tm-h">Impressões</p><p class="tm-big">${f(tot)}</p><p class="tm-pill">em ${ord.filter(k => T[k].imp > 0).length} ${UN}s de impressão</p>
          <div class="tm-dl"><div class="tm-donut" style="background:conic-gradient(${stops})"></div><div class="tm-leg">${ord.filter(k => T[k].imp > 0).map(k => `<p><i style="background:${col[k]}"></i><b>${f(T[k].imp)}</b> ${k}</p>`).join("")}</div></div>${D.temasBonus ? `<p class="tm-bonus">${esc(D.temasBonus)}</p>` : ""}</div>

  }

  
  if (D.verba) {

  if (D.destaque && D.destaque.ativo) {
    const d = D.destaque;
    slide("s-dark s-media", "As campanhas do mês", grid(head(tag(["Destaque do mês · ", MED, " · conteúdo de melhor desempenho"]), d.titulo[0], d.titulo[1], true) + `
      <div class="mt-xs" style="grid-column:1/-1;display:grid;grid-template-columns:200px 1fr;gap:calc(var(--gutter)*1.6);align-items:start">
        <div class="anim d2"><div class="thumb9 dst"><img class="cover" src="${d.capa}" alt="Capa do criativo"><a class="go" href="${esc(d.link)}" target="_blank" rel="noopener">Abrir post ↗</a></div></div>
        <div class="anim d3" style="min-width:0">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="font-size:20px;font-weight:800">${esc(d.nome)}</h3><span class="chip">${esc(d.plataforma)}</span></div>
          <p class="p-block" style="margin-top:8px;color:var(--gray-200)">${esc(d.participacao)}</p>
          <div class="dst-grid">${d.numeros.map(n => `<div><b>${v(n[0])}</b><span>${esc(n[1])}</span><i>${esc(n[2])}</i></div>`).join("")}</div>
          <div class="t9i" style="margin-top:14px"><b>Hipótese de desempenho</b>${esc(d.hipotese)}</div>
        </div></div>`));
  }

  
  const midiaSlide = nome => { const md = (D.midias || []).find(m => m.plataforma === nome); if (!md) return;
    const one = md.itens.length === 1;
    slide("s-dark s-media mdslide", "As campanhas do mês", grid(head(tag(["Conteúdos veiculados · ", MED, " · " + md.plataforma + " · " + D.periodo]), md.titulo[0], md.titulo[1]) + `
      <div class="col-span-10 md-g${one ? " md-one" : ""}${md.itens.length > 3 ? " md-many" : ""} anim d2">${md.itens.map(p => `<div class="md-r">
        <div class="md-th"><img src="${p.capa}" alt="Capa: ${esc(p.nome)}"></div>
        <div class="md-b"><p class="md-tg">${esc(p.tag || md.plataforma)}</p><p class="md-n">${esc(p.nome)}</p><p class="md-d">${esc(p.texto)}</p>${p.link ? `<a class="seepost" href="${esc(p.link)}" target="_blank" rel="noopener">ver o vídeo ↗</a>` : ""}</div>
        <div class="md-v"><b>${esc(p.views)}</b><span>impressões</span>${p.bonus ? `<i class="md-bn">${esc(p.bonus)}</i>` : ""}</div></div>`).join("")}</div>` + foot(md.rodape)));
  };
  const audBars = arr => { const mx = Math.max(...arr.map(x => x[1])); return arr.map(x => `<div class="aud-r"><span class="aud-n">${esc(x[0])}</span><span class="aud-t"><span class="aud-b" style="width:${(x[1] / mx * 100).toFixed(1)}%"></span></span><b class="aud-v">${Number(x[1]).toFixed(1).replace(".", ",")}%</b></div>`).join(""); };
  const audSlide = k => { const a = D[k]; if (!a) return;
    slide("s-light s-media publico-modelo aud-extra", "Público", grid(head(tag([a.tag + " · ", MED, " · " + D.periodo]), a.titulo[0], a.titulo[1], true) + `
      <div class="mt-sm" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter)">
        <div class="card anim d2"><p class="num">${esc(a.c1)}</p><div class="aud">${audBars(a.sites)}</div></div>
        <div class="card anim d3"><p class="num">${esc(a.c2)}</p><div class="aud">${audBars(a.idade)}</div></div>
        <div class="card anim d4"><p class="num">${esc(a.c3)}</p><div class="aud">${audBars(a.genero)}</div></div></div>
      <p class="p-block anim d5" style="grid-column:1/-1;margin-top:6px;font-size:16px">${esc(a.leitura)}</p>` + foot(a.rodape, "margin-top:10px")));
  };
  midiaSlide('YouTube');
  audSlide('audYoutube');
  slide("s-dark s-media display-conteudos", "As campanhas do mês", grid(head(tag(["Conteúdos veiculados · ", MED, " · Display · " + D.periodo]), D.displayConteudos.titulo[0], D.displayConteudos.titulo[1]) + `
    <div class="display-grid anim d2" style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px">${D.displayConteudos.itens.map(p=>`<div class="card dsp-c${p.nome === "728x90" ? " dsp-wide" : ""}"><div class="dsp-m"><img src="assets/display-${esc(p.nome)}.gif" alt="Banner ${esc(p.nome)}"></div><div class="dsp-t"><p class="num">Banner ${esc(p.nome)} · ${esc(p.rotulo)}</p><p style="font-size:24px;font-weight:800;color:var(--accent-on-dark)">${p.impressoes} <span style="font-size:15px;color:var(--gray-200)">impressões · ${p.participacao}</span></p><p style="font-size:16px;line-height:1.4">${p.texto}</p></div></div>`).join("")}</div>` + foot(D.displayConteudos.rodape)));
  audSlide('audDisplay');
  if (D.analise) {
    const A = D.analise, n = A.pecas.length;
    for (let k = 0; k < n; k += 2) {
      const ch = A.pecas.slice(k, k + 2), t = A.titulos[k / 2];
      const pos = (k + 1) + "º" + (ch.length > 1 ? " e " + (k + 2) + "º" : "");
      slide("s-light s-media anslide", "As campanhas do mês", grid(head(tag(["Análise de conteúdo · ", MED, " · Meta Ads · " + pos + " de " + n]), t[0], t[1]) + `
        <div class="col-span-10 an-g${ch.length === 1 ? " an-one" : ""} anim d2">${ch.map((p, i) => `<div class="an-c">
          <div class="an-top"><div class="an-th"><img src="${p.capa}" alt="Capa: ${esc(p.nome)}">${p.link ? `<a class="an-go" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir post ↗</a>` : ""}</div>
            <div class="an-b"><div class="an-bd"><span class="an-rk">${k + i + 1}º</span><span class="an-ch">${esc(p.plataforma)}</span>${p.formato ? `<span class="an-ch">${esc(p.formato)}</span>` : ""}${p.indice ? `<span class="an-ix">Índice ${esc(p.indice)}</span>` : ""}</div>
              <p class="an-n">${esc(p.nome)}</p>
              <div class="an-m">${p.metricas.map(m => `<div><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div>`).join("")}</div></div></div>
          <div class="an-in"><p class="an-il">Insight</p><p>${esc(p.insight)}</p></div></div>`).join("")}</div>` + foot(A.rodape)));
    }
  }
  midiaSlide('TikTok');

    
  {
  
  const bars = (arr, cls) => arr.map(a => `<div class="aud-r"><span class="aud-n">${esc(a[0])}</span><span class="aud-t"><span class="aud-b" style="width:${(a[1]/Math.max(...arr.map(x=>x[1]))*100).toFixed(1)}%"></span></span><b class="aud-v">${Number(a[1]).toFixed(1).replace(".", ",")}%</b></div>`).join("");
  slide("s-light s-media publico-modelo", "Público", grid(head(tag(["Público · ", MED, " · " + D.periodo]), D.publicoTitulo[0], D.publicoTitulo[1], true) + `
    <div class="mt-sm" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter)">
      <div class="card anim d2"><p class="num">GÊNERO</p><div class="aud">${bars(D.publico.genero)}</div></div>
      <div class="card anim d3"><p class="num">FAIXA ETÁRIA</p><div class="aud">${bars(D.publico.idade)}</div></div>
      <div class="card anim d4"><p class="num">POSICIONAMENTOS</p><div class="aud">${bars(D.publico.posicionamentos)}</div></div></div>
    <p class="p-block anim d5" style="grid-column:1/-1;margin-top:6px;font-size:16px">${esc(D.publico.leitura)}</p>` + foot(D.publico.rodape, "margin-top:10px")));
  }

  
  slide("s-dark", "Leituras e próximo ciclo", grid(head("Diagnóstico do ciclo", "Cinco achados", "resumem a campanha") + `
    <div class="modgrid mt-sm" style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter)">
      ${D.diagnostico.map((c, i) => `<div class="card anim d${i + 2}${i === 0 ? " dg-hl" : ""}"${i === 0 ? ' style="grid-column:1/-1"' : ""}><p class="num">${esc(c.titulo)}</p><p style="font-size:16px"><b>${esc(c.lead)}</b> ${esc(c.texto)}</p></div>`).join("")}
    </div>`));

  
  slide("s-light rcslide", "Recomendações", grid(head(D.recsTag || ("Recomendações para " + D.proximoMes), (D.recsTitulo || ["Movimentos que saem prontos", "do ciclo de " + D.mes.split(" ")[0]])[0], (D.recsTitulo || ["Movimentos que saem prontos", "do ciclo de " + D.mes.split(" ")[0]])[1]) + `
    <div class="rc-g2 mt-xs anim d2" style="grid-column:1/-1">
      <div class="card rc-p"><p class="num">Prioridade</p><p class="rc-pt">${esc(D.prioridade.titulo[0])} ${esc(D.prioridade.titulo[1])}</p><p class="rc-tx">${esc(D.prioridade.texto)}</p></div>
      <div class="rc-l">${D.recomendacoes.map(c => `<div class="card"><p class="num">${esc(c.titulo)}</p><p class="rc-tx">${esc(c.texto)}</p></div>`).join("")}</div>
    </div>`));

  
  slide("s-light", "Notas", grid(head("Notas de leitura", "Critérios e limites", "dos dados") + `
    <div class="modgrid mt-sm" style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter)">
      ${D.notas.map((c, i) => `<div class="card anim d${i + 2}"${i === D.notas.length - 1 ? ' style="grid-column:1/-1"' : ""}><p class="num">${esc(c.titulo)}</p><p style="font-size:15px">${esc(c.texto)}</p></div>`).join("")}
    </div>`));

  
  slide("s-dark", "Encerramento", `<div class="slide-grid" style="text-align:center"><div class="col-span-10">
    <h2 class="anim d1" style="font-size:clamp(30px,4vw,60px)"><em class="blk" style="text-transform:none">${esc(D.cliente)}</em></h2>
    <p class="serif anim d2 mt-sm" style="color:var(--gray-200)">${esc(D.periodoLongo)}</p>
    <div class="anim d3" style="display:flex;justify-content:center;align-items:center;gap:40px;margin-top:44px;flex-wrap:wrap"><img src="${AS.esquina}" alt="Esquina" style="height:28px;width:auto"><img src="${AS.horto || AS.cliente}" alt="${esc(D.cliente)}" style="height:66.24px;width:auto"></div>
  </div></div>`, "background:radial-gradient(80% 60% at 50% 100%,rgba(55,0,255,.24),transparent 60%),var(--black)");

  document.getElementById("deck").innerHTML = out.join("\n");
})();

</script>
<script>

(function(){
  const slides=[...document.querySelectorAll('.slide')];
  const dots=document.getElementById('dots');
  const bar=document.getElementById('bar');
  const chap=document.getElementById('chap');
  slides.forEach((s,i)=>{
    const b=document.createElement('button');
    b.setAttribute('aria-label','Tela '+(i+1));
    b.addEventListener('click',()=>s.scrollIntoView({behavior:'smooth'}));
    dots.appendChild(b);
  });
  const dbtns=[...dots.children];
  let cur=0;
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i=slides.indexOf(e.target);
        cur=i;
        dbtns.forEach((d,j)=>d.classList.toggle('on',j===i));
        bar.style.width=((i+1)/slides.length*100)+'%';
        chap.textContent=e.target.dataset.chapter||'';
        const light=e.target.classList.contains('s-light')||e.target.querySelector('.ee');
        dots.classList.toggle('dark',!!light);
        e.target.querySelectorAll('.anim').forEach(a=>a.classList.add('visible'));
        e.target.querySelectorAll('.fill[data-w]').forEach(f=>{f.style.width=f.dataset.w+'%';});
      }
    });
  },{threshold:.25});
  slides.forEach(s=>io.observe(s));
  document.addEventListener('keydown',e=>{
    if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();slides[Math.min(cur+1,slides.length-1)].scrollIntoView({behavior:'smooth'});}
    if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();slides[Math.max(cur-1,0)].scrollIntoView({behavior:'smooth'});}
  });
  
  if(location.protocol!=='file:'){document.querySelectorAll('.thumb iframe,.thumb9 iframe').forEach(f=>f.remove());}
  
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.anim').forEach(a=>a.classList.add('visible'));}
})();
</script>
</body>
